# Builds, tests and pushes the pipeline image (P6-39). Run from the repository root (the tests read
# datasets.yaml and schemas/), as tf-deployer, the only writer of dda-pipelines:
#   gcloud builds submit --project pltfrm-ngnrng --config pipelines/cloudbuild.yaml \
#     --service-account=projects/pltfrm-ngnrng/serviceAccounts/tf-deployer@pltfrm-ngnrng.iam.gserviceaccount.com \
#     --substitutions=_BUSINESS=customer,_TAG=$(git rev-parse --short HEAD) .
# dda-pipelines has immutable tags: every build needs a new _TAG. Under a trigger _TAG defaults to
# SHORT_SHA; a plain `gcloud builds submit` has no SHORT_SHA, so pass _TAG (the build fails if it
# is empty). The last step prints the pushed digest; put `<image>@sha256:...` into
# envs/<env>/core/<env>.tfvars (pipeline.image).
substitutions:
  _BUSINESS: customer
  _REGION: australia-southeast1
  _REPOSITORY: dda-pipelines
  _TAG: ${SHORT_SHA}
  _IMAGE: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_BUSINESS}-pipeline
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
steps:
  - id: check-tag
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args: ["-c", "test -n '${_TAG}' || { echo '_TAG is empty: pass --substitutions=_TAG=$(git rev-parse --short HEAD)'; exit 1; }"]
  - id: test
    name: ghcr.io/astral-sh/uv:0.12.16-python3.13-bookworm-slim
    dir: pipelines
    entrypoint: sh
    args: ["-c", "uv sync --frozen && uv run pytest -q"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}:${_TAG}", "pipelines"]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_IMAGE}:${_TAG}"]
  - id: digest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        DIGEST=$(gcloud artifacts docker images describe "${_IMAGE}:${_TAG}" --format='value(image_summary.digest)')
        echo "PIPELINE_IMAGE=${_IMAGE}@$${DIGEST}"
